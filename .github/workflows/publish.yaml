name: Build and Publish Docker Image

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if version exists (for Dockerfile changes)'
        required: false
        type: boolean
        default: false

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Fetch latest Claude Code version from npm
        id: npm-version
        run: |
          echo "Fetching latest version of @anthropic-ai/claude-code from npm registry..."
          version=$(curl -s https://registry.npmjs.org/@anthropic-ai/claude-code/latest | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
          echo "Latest npm version: ${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check if version exists on Docker Hub
        id: docker-version
        if: github.event.inputs.force_rebuild != 'true'
        run: |
          version="${{ steps.npm-version.outputs.version }}"
          if docker manifest inspect peterkuczera/claude-code:"${version}" > /dev/null 2>&1; then
            echo "Version ${version} already exists on Docker Hub"
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Version ${version} does not exist on Docker Hub - will build and publish"
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and push Docker image
        if: steps.docker-version.outputs.exists == 'false' || github.event.inputs.force_rebuild == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.npm-version.outputs.version }}
          tags: |
            peterkuczera/claude-code:${{ steps.npm-version.outputs.version }}
            peterkuczera/claude-code:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          version="${{ steps.npm-version.outputs.version }}"
          exists="${{ steps.docker-version.outputs.exists }}"
          force_rebuild="${{ github.event.inputs.force_rebuild }}"

          if [ "${force_rebuild}" = "true" ]; then
            echo "🔨 Force rebuild: Successfully rebuilt and published version ${version}"
          elif [ "${exists}" = "true" ]; then
            echo "✅ Version ${version} already published - no action needed"
          else
            echo "🚀 Successfully built and published version ${version}"
          fi
